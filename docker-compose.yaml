x-milvus-image: milvusdb/milvus:v3.0.2
services:
  milvus-volume-init:
    image: milvusdb/milvus:v3.0.2
    user: 0:0
    network_mode: none
    read_only: true
    restart: 'no'
    entrypoint:
    - /bin/sh
    - -c
    command:
    - "set -eu\nuid=\"$$(id -u milvus)\"\ngid=\"$$(id -g milvus)\"\nmarker=\"/var/lib/milvus/.milvus-volume-owner-$${uid}-$${gid}\"\
      \nif [ ! -e \"$${marker}\" ]; then\n  echo \"Preparing /var/lib/milvus for $${uid}:$${gid}\"\
      \n  chown -R \"$${uid}:$${gid}\" /var/lib/milvus\n  touch \"$${marker}\"\n \
      \ chown \"$${uid}:$${gid}\" \"$${marker}\"\nfi\n"
    volumes:
    - milvus_data:/var/lib/milvus
  etcd:
    image: quay.io/coreos/etcd:v3.5.25
    environment:
    - ETCD_AUTO_COMPACTION_MODE=revision
    - ETCD_AUTO_COMPACTION_RETENTION=1000
    - ETCD_QUOTA_BACKEND_BYTES=4294967296
    - ETCD_SNAPSHOT_COUNT=50000
    volumes:
    - etcd_data:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379
      --data-dir /etcd
    healthcheck:
      test:
      - CMD
      - etcdctl
      - endpoint
      - health
      interval: 30s
      timeout: 20s
      retries: 3
  minio:
    image: milvusdb/minio:RELEASE.2024-12-18T13-15-44Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
    - minio_data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test:
      - CMD
      - mc
      - ready
      - local
      interval: 30s
      timeout: 20s
      retries: 3
  standalone:
    image: milvusdb/milvus:v3.0.2
    command:
    - milvus
    - run
    - standalone
    environment:
      MINIO_REGION: us-east-1
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
    - milvus_data:/var/lib/milvus
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:9091/healthz
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    depends_on:
      milvus-volume-init:
        condition: service_completed_successfully
      etcd:
        condition: service_started
      minio:
        condition: service_started
    ports:
    - 127.0.0.1:19530:19530
    - 127.0.0.1:9091:9091
name: rag-studio
volumes:
  milvus_data: {}
  etcd_data: {}
  minio_data: {}
